version: '3.8'

services:
  nexus-ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    networks:
      - nexus-network

  nexus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - NEXUS_ML_SERVICE_URL=http://nexus-ml:5000/predict
    depends_on:
      - nexus-ml
    networks:
      - nexus-network

  nexus-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api
    depends_on:
      - nexus-backend
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
